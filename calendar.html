<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#16a34a" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="db.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <a id="backLink" href="index.html" class="back-link" aria-label="Back">
          <span class="back-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
          <span class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4V12c0 5-4 8.5-8 10C8 20.5 4 17 4 12V6z"/></svg></span>
          <span class="logo-text" id="backTeamName">TactIQ</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="notFound" style="display:none;" class="hero">
      <h2>Team not found</h2>
      <a href="index.html" class="btn-primary" style="text-decoration:none;">Back</a>
    </div>

    <div id="pageContent" style="display:none;">
      <div class="team-hero">
        <h1 class="team-headline">Calendar</h1>
        <p class="team-meta" id="calTeamMeta"></p>
      </div>

      <!-- Month nav -->
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev">&#8249;</button>
        <span class="cal-month-title" id="calMonthTitle"></span>
        <button class="cal-nav-btn" id="calNext">&#8250;</button>
      </div>

      <!-- Calendar grid -->
      <div class="cal-grid" id="calGrid"></div>

      <!-- Upcoming events strip -->
      <div class="cal-upcoming" id="calUpcoming"></div>
    </div>
  </main>

  <!-- Day events bottom sheet -->
  <div class="lu-picker-backdrop" id="dayBackdrop">
    <div class="lu-picker" id="dayPanel">
      <div class="lu-picker-header">
        <span class="lu-picker-title" id="dayPanelTitle">Events</span>
        <button class="modal-close" id="closeDayPanel">&times;</button>
      </div>
      <div id="dayEventsList" style="padding:0 16px;"></div>
      <div id="dayPanelFooter" style="padding:12px 16px 4px;"></div>
    </div>
  </div>

  <!-- Add / Edit event form -->
  <div class="lu-picker-backdrop" id="eventFormBackdrop">
    <div class="lu-picker" id="eventFormPanel">
      <div class="lu-picker-header">
        <span class="lu-picker-title" id="eventFormTitle">Add Event</span>
        <button class="modal-close" id="closeEventForm">&times;</button>
      </div>
      <div class="cal-form">
        <div class="lg-form-group">
          <label class="lg-form-label">Title</label>
          <input type="text" class="lg-form-input" id="evtTitle" placeholder="e.g. Training Session" maxlength="80" autocomplete="off" />
        </div>
        <div class="lg-form-group">
          <label class="lg-form-label">Type</label>
          <div class="cal-type-row" id="evtTypeRow">
            <button class="cal-type-btn" data-type="training">Training</button>
            <button class="cal-type-btn" data-type="match">Match</button>
            <button class="cal-type-btn" data-type="meeting">Meeting</button>
            <button class="cal-type-btn" data-type="other">Other</button>
          </div>
        </div>
        <div class="lg-form-row">
          <div class="lg-form-group" style="flex:1;">
            <label class="lg-form-label">Date</label>
            <input type="date" class="lg-form-input" id="evtDate" />
          </div>
          <div class="lg-form-group" style="flex:1;">
            <label class="lg-form-label">Time (optional)</label>
            <input type="text" class="lg-form-input" id="evtTime" placeholder="e.g. 18:00" maxlength="5" autocomplete="off" />
          </div>
        </div>
        <div class="lg-form-group">
          <label class="lg-form-label">Repeat</label>
          <div class="cal-recur-row" id="evtRecurRow">
            <button class="cal-recur-btn cal-recur-active" data-recur="none">Does not repeat</button>
            <button class="cal-recur-btn" data-recur="weekly">Weekly</button>
            <button class="cal-recur-btn" data-recur="biweekly">Every 2 weeks</button>
            <button class="cal-recur-btn" data-recur="monthly">Monthly</button>
          </div>
        </div>
        <div class="lg-form-group">
          <label class="lg-form-label">Notes (optional)</label>
          <textarea class="lg-form-input" id="evtNotes" rows="3" placeholder="Any additional info…" maxlength="500" style="resize:none;height:72px;"></textarea>
        </div>
        <button class="btn-primary" id="saveEventBtn" style="width:100%;">Save Event</button>
      </div>
    </div>
  </div>

  <!-- Recurring event delete choice modal -->
  <div class="lu-picker-backdrop" id="recurDeleteBackdrop">
    <div class="lu-picker" id="recurDeletePanel" style="max-width:340px;">
      <div class="lu-picker-header">
        <span class="lu-picker-title">Delete recurring event</span>
        <button class="modal-close" id="closeRecurDelete">&times;</button>
      </div>
      <div style="padding:16px;">
        <p style="color:var(--text-muted);font-size:.88rem;margin:0 0 16px;">How would you like to delete?</p>
        <button class="btn-primary" id="recurDelThisBtn" style="width:100%;margin-bottom:10px;">This date only</button>
        <button class="btn-primary" id="recurDelAllBtn" style="width:100%;background:var(--danger,#ef4444);border-color:var(--danger,#ef4444);">All occurrences</button>
      </div>
    </div>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
