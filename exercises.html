<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercises</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <a id="backLink" href="index.html" class="back-link" aria-label="Back to team">
          <span class="back-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
          <span class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4V12c0 5-4 8.5-8 10C8 20.5 4 17 4 12V6z"/></svg></span>
          <span class="logo-text" id="backTeamName">Football Coach</span>
        </a>
      </div>
      <button class="btn-primary" id="openAddExercise">+ Add Exercise</button>
    </div>
  </header>

  <main>
    <div id="notFound" style="display:none;" class="hero">
      <h2>Team not found</h2>
      <p>This team may have been deleted.</p>
      <a href="index.html" class="btn-primary" style="text-decoration:none;">Back to Home</a>
    </div>

    <div id="pageContent">
      <div class="team-hero">
        <h1 class="team-headline">Exercises</h1>
        <p id="teamMeta" class="team-meta"></p>
      </div>

      <div id="exercisesEmpty" class="players-empty" style="display:none;">
        <p>No exercises yet. Add your first exercise to get started.</p>
      </div>

      <ul class="players-list" id="exercisesList"></ul>
    </div>
  </main>

  <!-- Add Exercise Modal -->
  <div class="modal-backdrop" id="exerciseModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exerciseModalTitle">
      <div class="modal-header">
        <h3 id="exerciseModalTitle">Add Exercise</h3>
        <button class="modal-close" id="closeExerciseModal" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg></button>
      </div>
      <div class="modal-body">
        <label for="exerciseNameInput">Exercise name</label>
        <input
          type="text"
          id="exerciseNameInput"
          placeholder="e.g. Passing drill"
          maxlength="60"
          autocomplete="off"
        />
        <p class="input-error" id="exerciseInputError"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelExerciseModal">Cancel</button>
        <button class="btn-primary" id="addExerciseBtn">Add Exercise</button>
      </div>
    </div>
  </div>

  <script src="exercises.js"></script>
</body>
</html>
