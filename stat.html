<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Stats</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#16a34a" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="db.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <a id="backLink" href="index.html" class="back-link" aria-label="Back to stats">
          <span class="back-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
          <span class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4V12c0 5-4 8.5-8 10C8 20.5 4 17 4 12V6z"/></svg></span>
          <span class="logo-text" id="backTeamName">TactIQ</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="notFound" style="display:none;" class="hero">
      <h2>Game not found</h2>
      <a id="notFoundBack" href="index.html" class="btn-primary" style="text-decoration:none;">Back</a>
    </div>

    <div id="pageContent">
      <div class="team-hero">
        <h1 class="team-headline" id="gameName"></h1>
        <p class="team-meta" id="gameMeta"></p>
      </div>

      <section class="stat-section">
        <div class="tactic-header">
          <h2 class="section-title" style="margin-bottom:0;">Player Stats</h2>
          <div class="notes-status" id="saveStatus"></div>
        </div>

        <div id="noPlayers" style="display:none;" class="players-empty">
          <p>No players in this team yet. Add players first to record stats.</p>
        </div>

        <div id="statTableWrap">
          <div class="stat-table-wrap">
            <div class="stat-col-header">
              <span>Player</span>
              <span>Goals</span>
              <span>Assists</span>
              <span>Min</span>
              <span>YC</span>
              <span>RC</span>
              <span title="Duels Won">D.Won</span>
              <span title="Duels Lost">D.Lost</span>
              <span title="Chances Created">CC</span>
              <span title="Mistakes">Mis.</span>
            </div>
            <div id="statRows"></div>
          </div>
        </div>
      </section>

      <section class="stat-section" id="timelineSection">
        <div class="tactic-header" style="margin-bottom:12px;">
          <h2 class="section-title" style="margin-bottom:0;">Match Timeline</h2>
          <button class="btn-secondary btn-sm" id="tlToggleBtn" style="font-size:0.8rem;padding:4px 10px;">Hide</button>
        </div>
        <div class="tl-filters" id="tlFilters">
          <button class="tl-filter-btn tl-filter-active" data-type="goal">⚽ Goals</button>
          <button class="tl-filter-btn tl-filter-active" data-type="card">🃏 Cards</button>
          <button class="tl-filter-btn tl-filter-active" data-type="sub">↕ Subs</button>
        </div>
        <div class="tl-track" id="tlTrack"></div>
      </section>
    </div>
  </main>

  <script src="stat.js"></script>
</body>
</html>
