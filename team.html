<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <a href="index.html" class="back-link" aria-label="Back to all teams">
          <span class="back-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
          <span class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4V12c0 5-4 8.5-8 10C8 20.5 4 17 4 12V6z"/></svg></span>
          <span class="logo-text">Football Coach</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div id="notFound" style="display:none;" class="hero">
      <h2>Team not found</h2>
      <p>This team may have been deleted.</p>
      <a href="index.html" class="btn-primary" style="text-decoration:none;">Back to Home</a>
    </div>

    <div id="teamContent">
      <div class="team-hero">
        <h1 id="teamName" class="team-headline"></h1>
        <p id="teamMeta" class="team-meta"></p>
      </div>

      <h2 class="section-title">Categories</h2>
      <div class="teams-grid">
        <div class="team-card category-card" id="goToPlayers" tabindex="0" role="button" aria-label="Open Players">
          <div class="team-card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-8 8-8s8 4 8 8"/></svg></div>
          <div class="team-card-name">Players</div>
          <div class="team-card-meta" id="playerCount">0 players</div>
        </div>
        <div class="team-card category-card" id="goToExercises" tabindex="0" role="button" aria-label="Open Exercises">
          <div class="team-card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
          <div class="team-card-name">Exercises</div>
          <div class="team-card-meta" id="exerciseCount">0 exercises</div>
        </div>
        <div class="team-card category-card" id="goToPlays" tabindex="0" role="button" aria-label="Open Plays">
          <div class="team-card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>
          <div class="team-card-name">Plays</div>
          <div class="team-card-meta" id="playCount">0 plays</div>
        </div>
        <div class="team-card category-card" id="goToStats" tabindex="0" role="button" aria-label="Open Stats">
          <div class="team-card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg></div>
          <div class="team-card-name">Stats</div>
          <div class="team-card-meta" id="gameCount">0 games</div>
        </div>
        <div class="team-card category-card" id="goToPoints" tabindex="0" role="button" aria-label="Open Points Table">
          <div class="team-card-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="13" width="6" height="8" rx="1"/><rect x="9" y="8" width="6" height="13" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/><line x1="2" y1="21" x2="22" y2="21"/></svg></div>
          <div class="team-card-name">Points</div>
          <div class="team-card-meta" id="pointsTeamCount">not set up</div>
        </div>
      </div>
    </div>
  </main>

  <script src="team.js"></script>
</body>
</html>
